# Agent Board title integration.
# Merge these values into your active Ghostty configuration.
macos-applescript = true

# Ghostty 1.3 defaults, with title decoration disabled so the status glyph
# remains the first character. Preserve any other bell choices you prefer.
bell-features = no-system,no-audio,attention,no-title,no-border

# Tabs.
keybind = cmd+t=new_tab
keybind = cmd+w=close_surface

# Agent Board owns registered tab titles. Rename them directly with:
#   agent-name <project-name>
# Or bind the native macOS `agent-name` prompt to cmd+shift+r in Shortcuts.
# Ghostty assigns this chord to its manual title prompt by default on macOS, so
# explicitly remove that binding before assigning the Agent Board Service.
keybind = cmd+shift+r=unbind

# Direct project-tab navigation.
keybind = cmd+1=goto_tab:1
keybind = cmd+2=goto_tab:2
keybind = cmd+3=goto_tab:3
keybind = cmd+4=goto_tab:4
keybind = cmd+5=goto_tab:5
keybind = cmd+6=goto_tab:6
keybind = cmd+7=goto_tab:7
keybind = cmd+8=goto_tab:8
keybind = cmd+9=goto_tab:9

# Jump between shell and agent prompts.
keybind = cmd+up=jump_to_prompt:-1
keybind = cmd+down=jump_to_prompt:1

# Start new tabs and splits in the current project directory.
tab-inherit-working-directory = true
split-inherit-working-directory = true

# Show project tabs in the macOS title bar.
macos-titlebar-style = tabs
