# Recommended Codex /statusline configuration. Agent Board's tested protocol
# families are 0.147.x, 0.148.x, 0.149.x, 0.150.x, 0.152.x, 0.153.x, and 0.154.x;
# 0.151.x remains explicitly excluded. The 0.154.0 schema/lifecycle probe does
# not validate status-line visual rendering.
# Merge this table into ~/.codex/config.toml. Do not create a duplicate [tui]
# table when that file already contains one.
[tui]
status_line = ["project-name", "git-branch", "model-with-reasoning", "context-used"]
status_line_use_colors = true
