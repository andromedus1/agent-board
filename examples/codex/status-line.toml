# Recommended Codex /statusline configuration. Agent Board requires Codex
# 0.147 or later, excluding 0.151.x, and checks newer untested releases for
# compatible remote-TUI and app-server capabilities. These checks do not
# validate status-line visual rendering.
# Merge this table into ~/.codex/config.toml. Do not create a duplicate [tui]
# table when that file already contains one.
[tui]
status_line = ["project-name", "git-branch", "model-with-reasoning", "context-used"]
status_line_use_colors = true
