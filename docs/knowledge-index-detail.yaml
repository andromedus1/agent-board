      '
    decisions:
    - Managed app-server plus `codex --remote` is the default Codex V1 topology; ordinary mode remains
      a registration-only diagnostic state until a managed observer attaches.
    - Managed ordinary Claude plus a bundled per-run hook integration is the Claude topology; hook gaps
      remain lower-confidence or diagnostic rather than being promoted to native state.
    - Each supervised tab owns its short-lived launcher, app-server, TUI, and observer process group;
      there is no global resident daemon.
    - The stable Board session, Ghostty binding, and project identity outlive a managed runtime; each
      relaunch replaces the prior launcher metadata and native Codex thread binding.
    - The implementation is a Node.js 22+ TypeScript modular monolith with runtime-validated external
      boundaries.
    - One versioned session record is the source of truth and is updated atomically under a per-session
      lock.
    - The domain stores orthogonal identity, activity, attention, health, adapter evidence, and terminal
      presence; visible statuses are derived centrally.
    - Managed working projection uses an ephemeral, reconciliation-verified launcher process existence
      check matched to the persisted launcher binding; the 60-second freshness threshold remains a fallback
      whenever that proof is unavailable.
    - Ghostty 1.3+ AppleScript stable IDs and targeted tab-title overrides are the primary terminal contract.
    - Completion acknowledgement is Board-owned and clears when the registered Ghostty tab is reliably
      focused, with an explicit acknowledgement command as fallback.
    - Provider compatibility is explicit and evidence-preserving: experimental Codex protocol families
